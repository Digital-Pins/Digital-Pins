server {
    listen 80;
    listen [::]:80;
    server_name digitalpin.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name digitalpin.online;

    # Cloudflare Origin CA certificate (upload to these paths)
    ssl_certificate     /etc/ssl/cloudflare/digitalpin.online.pem;
    ssl_certificate_key /etc/ssl/cloudflare/digitalpin.online.key;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # Static docs (company profile, assets)
    location /docs/ {
        alias /opt/dolibarr/doc/Dev-Hub-web-content/;
        autoindex on;
        add_header Cache-Control "public, max-age=3600";
    }

    # Dolibarr REST API reverse proxy (flexible CORS + key pass-through)
    # Usage examples (from browser apps under allowed origins or server-to-server):
    #   GET https://digitalpin.online/erp-api/invoices?limit=1
    #   Header: DOLAPIKEY: <API_KEY>
    # This simply forwards to: https://erp.digitalpin.online/api/index.php/invoices?limit=1
    # and passes the DOLAPIKEY header as-is.
    location ~ ^/erp-api/(.*)$ {
        # CORS: allow requests from our domains; reflect Origin when it matches
        set $cors_origin "";
        if ($http_origin ~* ^https?://([a-z0-9-]+\.)?digitalpin\.online$) { set $cors_origin $http_origin; }

        # Preflight handling
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Vary' 'Origin' always;
            add_header 'Access-Control-Allow-Credentials' 'false' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DOLAPIKEY, Authorization, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        # CORS headers on actual responses
        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
        add_header 'Vary' 'Origin' always;

        # Proxy to Dolibarr ERP REST API
        proxy_http_version 1.1;
        proxy_set_header Host erp.digitalpin.online;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass through client-provided API key if present
        proxy_set_header DOLAPIKEY $http_dolapikey;

        # Build upstream path; keep original query string intact
        set $erp_path /api/index.php/$1;
        proxy_ssl_server_name on;
        proxy_pass https://erp.digitalpin.online$erp_path$is_args$args;
    }

    # Next.js static assets (immutable)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3220;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
