<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title>DigitalPin Bridge Logo</title>
  <desc>A minimal bridge mark symbolizing connection and trust</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5C8CFF"/>
      <stop offset="100%" stop-color="#3778FF"/>
    </linearGradient>
  </defs>
  <!-- Bridge base line -->
  <path d="M12 88 H116" stroke="url(#g)" stroke-width="7" stroke-linecap="round"/>
  <!-- Arch -->
  <path d="M16 88 C 36 44, 92 44, 112 88" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="7"/>
  <!-- Pylons -->
  <path d="M40 88 V54" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="7" stroke-linecap="round"/>
  <path d="M88 88 V54" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="7" stroke-linecap="round"/>
  <!-- Cables -->
  <path d="M40 56 C 56 52, 72 52, 88 56" fill="none" stroke="#9EB8FF" stroke-width="4" opacity="0.8"/>
  <path d="M40 66 C 56 60, 72 60, 88 66" fill="none" stroke="#9EB8FF" stroke-width="3" opacity="0.7"/>
  <path d="M40 76 C 56 70, 72 70, 88 76" fill="none" stroke="#9EB8FF" stroke-width="2" opacity="0.6"/>
  <!-- Pin accent -->
  <circle cx="64" cy="40" r="7" fill="#3778FF"/>
  <path d="M64 47 L64 60" stroke="#3778FF" stroke-width="3.5" stroke-linecap="round"/>
  <ellipse cx="64" cy="40" rx="12" ry="12" fill="#3778FF" fill-opacity="0.12"/>
</svg>
